{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Utopia</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    /* minimal, keep inlined so you see immediate results; move to static/css/style.css later */
    body{font-family:Inter, Arial, sans-serif; margin:0; background:#f6f7fb; color:#111}
    .container{max-width:900px;margin:20px auto;padding:0 16px}
    nav{background:#fff;border-bottom:1px solid #e6e9ef;padding:10px 0}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;padding:0 16px}
    .brand{font-weight:700}
    .nav-links a{margin-left:14px;text-decoration:none;color:#1f2937}
    .card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,0.03)}
    .muted{color:#6b7280;font-size:0.9rem}
    .btn{background:#2563eb;color:#fff;padding:8px 12px;border-radius:6px;text-decoration:none;display:inline-block}
    .btn-ghost{background:transparent;border:1px solid #d1d5db;color:#111;padding:6px 10px;border-radius:6px;text-decoration:none}
    img.post-image{max-width:100%;border-radius:6px;margin-top:8px}
    form .form-control, form textarea{width:100%;padding:8px;border:1px solid #e6e9ef;border-radius:6px}
    .meta{font-size:0.85rem;color:#475569}
    .comment{border-top:1px solid #eef2f6;padding-top:10px;margin-top:10px}
    .small{font-size:0.9rem;color:#374151}
  </style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <div class="left">
        <a class="brand" href="{% url 'home' %}">Utopia</a>
      </div>

      <div class="nav-links">
        <a href="{% url 'posts:feed' %}">Feed</a>
        <a href="{% url 'posts:create_post' %}">Create</a>
        {% if user.is_authenticated %}
          <a href="{% url 'posts:profile_posts' user.profile.id %}">Profile</a>
          <a href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a href="{% url 'login' %}">Login</a>
          <a href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container">
    {% if messages %}
      {% for message in messages %}
        <div class="card" style="border-left:4px solid #10b981">
          <div class="small">{{ message }}</div>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer style="text-align:center;padding:40px 0;color:#9ca3af">
    © Utopia — built with Django
  </footer>
</body>
</html>
