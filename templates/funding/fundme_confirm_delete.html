<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete</title>
</head>
<body>
{% extends 'base.html' %}
{% block content %}
<h2>Delete "{{ post.title }}"?</h2>
<p>This action cannot be undone.</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger">Confirm Delete</button>
  <a href="{% url 'fundme_detail' post.pk %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}

</body>
</html>
