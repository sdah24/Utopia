{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Utopia</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Favicon (optional) -->
  <link rel="icon" href="{% static 'images/favicon.png' %}" type="image/png">

  <style>
    body {
      background-color: #f4f6f8;
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background: linear-gradient(90deg, #007bff, #6610f2);
    }

    .navbar-brand {
      font-weight: 700;
      color: white !important;
      letter-spacing: 1px;
    }

    .nav-link {
      color: #f8f9fa !important;
      font-weight: 500;
      transition: 0.3s;
    }

    .nav-link:hover {
      color: #ffc107 !important;
    }

    .content-card {
      background-color: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      padding: 25px;
      margin-top: 20px;
    }

    footer {
      background-color: #212529;
      color: #adb5bd;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
      border-top: 3px solid #6610f2;
    }

    footer a {
      color: #ffc107;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="/">Utopia</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon text-white"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'posts' %}">Posts</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'ask' %}">Ask</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'fundme' %}">FundMe</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}"><i class="bi bi-person-circle"></i></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container my-4">
    <div class="content-card">
      {% block content %}
      {% endblock %}
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>© 2025 Utopia — Made with ❤️ by Team Utopia</p>
    <p><a href="#">Privacy Policy</a> | <a href="#">Contact</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
