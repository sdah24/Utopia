<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Utopia</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-100">
  <nav class="bg-white shadow p-4">
    <div class="flex justify-between items-center">
      <a href="{% url 'home' %}" class="text-2xl font-bold text-green-600">Utopia</a>
      <div class="space-x-4">
        <a href="{% url 'posts:feed' %}" class="hover:text-green-600">Feed</a>
        <a href="{% url 'posts:create_post' %}" class="hover:text-green-600">Create</a>

        {% if user.is_authenticated %}
          <a href="{% url 'accounts:people_list' %}" class="hover:text-green-600">People</a>
          <a href="{% url 'posts:profile_posts' user.profile.id %}" class="hover:text-green-600">Profile</a>
          <a href="{% url 'accounts:logout' %}" class="hover:text-green-600">Logout</a>
        {% else %}
          <a href="{% url 'accounts:login' %}" class="hover:text-green-600">Login</a>
          <a href="{% url 'accounts:register' %}" class="hover:text-green-600">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container mx-auto p-4">
    {% if messages %}
      {% for message in messages %}
        <div class="bg-green-100 text-green-700 p-2 rounded mb-2">{{ message }}</div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <footer class="text-center text-gray-500 py-6">
    © Utopia — built with Django
  </footer>
</body>
</html>
