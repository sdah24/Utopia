{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Utopia | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff, #e3f2fd);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-card {
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 400px;
    }
    h2 {
      text-align: center;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background-color: #0d6efd;
      border: none;
      padding: 12px;
      color: white;
      font-size: 18px;
      border-radius: 10px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <h2>Login to Utopia</h2>
    <form method="POST">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Login</button>
    </form>
    <p class="text-center mt-3">
      Don’t have an account?
      <a href="{% url 'accounts:register' %}">Register here</a>
    </p>
  </div>
</body>
</html>
