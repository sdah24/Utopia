<!doctype html>
<html>
<head><meta charset="utf-8"><title>Create Post</title></head>
<body>
    <h1>Create Post</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Post</button>
    </form>
    <p><a href="{% url 'posts:feed' %}">Back to feed</a></p>
</body>
</html>
