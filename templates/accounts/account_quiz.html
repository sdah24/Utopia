{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Utopia | Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f0f4ff, #e3f2fd);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quiz-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 90%;
      max-width: 650px;
    }
    .quiz-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .quiz-header h1 {
      font-weight: bold;
      color: #2c3e50;
    }
    .question-block {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      background-color: #0d6efd;
      border: none;
      padding: 12px;
      color: white;
      font-size: 18px;
      border-radius: 10px;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0b5ed7;
    }
  </style>
</head>

<body>
  <div class="quiz-card">
    <div class="quiz-header">
      <h1>🧠 Quiz Challenge</h1>
      <p class="text-muted">You must pass this quiz to complete registration!</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      {% for q in questions %}
        <div class="question-block">
          <h5>Question {{ forloop.counter }}: {{ q.question_text }}</h5>
          <div class="mt-2">
            <label><input type="radio" name="q{{ q.id }}" value="A" required> {{ q.opt_a }}</label><br>
            <label><input type="radio" name="q{{ q.id }}" value="B"> {{ q.opt_b }}</label><br>
            <label><input type="radio" name="q{{ q.id }}" value="C"> {{ q.opt_c }}</label><br>
            <label><input type="radio" name="q{{ q.id }}" value="D"> {{ q.opt_d }}</label>
          </div>
        </div>
      {% endfor %}
      <button type="submit">Submit Answers</button>
    </form>
  </div>
</body>
</html>
