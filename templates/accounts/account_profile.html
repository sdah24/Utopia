<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>Welcome, {{ profile.user.username }}</h2>

{% if profile.profile_pic %}
    <img src="{{ profile.profile_pic.url }}" alt="Profile picture" width="150">
{% endif %}

<p><b>Bio:</b> {{ profile.bio }}</p>
<p><b>Score:</b> {{ profile.score }}</p>

<a href="{% url 'logout' %}">Logout</a>

</body>
</html>
